<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 8px 8px 0 0;
      }
      .content {
        border: 1px solid #ddd;
        padding: 20px;
        border-top: none;
        border-radius: 0 0 8px 8px;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #777;
        margin-top: 20px;
      }
      .book-details {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        margin: 15px 0;
      }
      .date {
        font-weight: bold;
        color: #e67e22;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Loan Confirmation</h1>
    </div>
    <div class="content">
      <p>Hello <span th:text="${user.username}">User</span>,</p>
      <p>You have successfully borrowed a book from our library.</p>

      <div class="book-details">
        <strong>Book:</strong> <span th:text="${book.title}">Title</span><br />
        <strong>Author:</strong> <span th:text="${book.author}">Author</span
        ><br />
        <strong>Due Date:</strong>
        <span
          class="date"
          th:text="${#dates.format(loan.dueDate, 'yyyy-MM-dd')}"
          >2026-02-14</span
        >
      </div>

      <p>
        Please remember to return the book on or before the due date to avoid
        penalties.
      </p>
      <p>Happy reading!</p>
    </div>
    <div class="footer">© 2026 Book Library System. All rights reserved.</div>
  </body>
</html>
