<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background-color: #f1c40f;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 8px 8px 0 0;
      }
      .content {
        border: 1px solid #ddd;
        padding: 20px;
        border-top: none;
        border-radius: 0 0 8px 8px;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #777;
        margin-top: 20px;
      }
      .penalty-box {
        background-color: #fff9db;
        border-left: 5px solid #f1c40f;
        padding: 15px;
        margin: 15px 0;
      }
      .strikes {
        font-weight: bold;
        font-size: 24px;
        color: #f39c12;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Penalty Applied</h1>
    </div>
    <div class="content">
      <p>Hello <span th:text="${user.username}">User</span>,</p>
      <p>
        This is to inform you that a penalty has been applied to your account.
      </p>

      <div class="penalty-box">
        <p th:text="${message}">Details of the penalty.</p>
        <p>
          Your current strike count:
          <span class="strikes" th:text="${user.strikes}">1</span> / 3
        </p>
      </div>

      <p>
        Please note that reaching 3 strikes will result in an automatic account
        suspension.
      </p>
    </div>
    <div class="footer">© 2026 Book Library System. All rights reserved.</div>
  </body>
</html>
