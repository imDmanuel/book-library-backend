<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background-color: #e74c3c;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 8px 8px 0 0;
      }
      .content {
        border: 1px solid #ddd;
        padding: 20px;
        border-top: none;
        border-radius: 0 0 8px 8px;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #777;
        margin-top: 20px;
      }
      .book-details {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Reservation Expired</h1>
    </div>
    <div class="content">
      <p>Hello <span th:text="${user.username}">User</span>,</p>
      <p>
        Your reservation for the following book has expired as it was not
        collected in time:
      </p>

      <div class="book-details">
        <strong>Book:</strong> <span th:text="${book.title}">Title</span><br />
        <strong>Author:</strong> <span th:text="${book.author}">Author</span>
      </div>

      <p>
        If you still wish to read this book, you can create a new reservation at
        any time.
      </p>
    </div>
    <div class="footer">© 2026 Book Library System. All rights reserved.</div>
  </body>
</html>
