spring.application.name=book-library
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/book-library}

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Or wherever your frontend handles the token
frontend.redirect.url=${FRONTEND_REDIRECT_URL:http://localhost:3000/oauth2/callback}

# Add these lines for request/response logging
# Or use Spring Boot's built-in request logging
# server.tomcat.accesslog.enabled=true
# server.tomcat.accesslog.directory=logs
# server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)

# Console logging configuration
logging.level.root=INFO

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Resend API Configuration
resend.api.key=${RESEND_API_KEY}
notification.email.from=${NOTIFICATION_EMAIL_FROM}

# Email Configuration (SMTP Backup)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true